<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Վերականգնել գաղտնաբառը — THUGINNN IMPERIA</title>
  <link rel="stylesheet" href="css/auth.css" />
  <script defer src="js/auth.js"></script>
</head>
<body class="auth-page dark">
  <main class="auth-container">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="logo" /></a>
    <h1>Վերականգնել գաղտնաբառը</h1>

    <form id="reset-form" action="/api/auth/reset-password" method="POST" novalidate>
      <input type="hidden" id="token" name="token" value="" />
      <label for="newPassword">Նոր գաղտնաբառ</label>
      <input id="newPassword" name="newPassword" type="password" required minlength="8" />
      <label for="newPassword2">Կրկնել նոր գաղտնաբառը</label>
      <input id="newPassword2" name="newPassword2" type="password" required minlength="8" />
      <div class="form-row">
        <button class="btn btn-primary" type="submit">Վերականգնել</button>
      </div>
    </form>
  </main>

  <script>
    // read token from URL query and set hidden input
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    document.getElementById('token').value = token;
  </script>
</body>
</html>

<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Մոռացե՞լ եք գաղտնաբառը — THUGINNN IMPERIA</title>
  <link rel="stylesheet" href="css/auth.css" />
  <script defer src="js/auth.js"></script>
</head>
<body class="auth-page dark">
  <main class="auth-container">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="logo" /></a>
    <h1>Մոռացե՞լ եք գաղտնաբառը</h1>

    <form id="forgot-form" action="/api/auth/forgot-password" method="POST" novalidate>
      <label for="email">Մուտքագրեք ձեր Էլ․ փոստը</label>
      <input id="email" name="email" type="email" required />
      <div class="form-row">
        <button class="btn btn-primary" type="submit">Ուղարկել նամակ</button>
      </div>
      <p class="small">Վերադառնալ՝ <a href="login.html">Մուտք</a></p>
    </form>
  </main>
</body>
</html>
